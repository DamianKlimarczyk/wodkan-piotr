function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function fid(f) { return f.firma + "|" + f.stoisko; }
function saveDone() { localStorage.setItem(DONE_KEY, JSON.stringify(done)); }
function telLink(t) {
  const n = String(t || "").replace(/\s+/g, "");
  return n ? `<a href="tel:${esc(n)}">${esc(t)}</a>` : "";
}
function personName(c) {
  return c.linkedin ? `<a href="${esc(c.linkedin)}">${esc(c.osoba)}</a>` : esc(c.osoba);

function priBadge(c) {
  const label = c.pri === "must" ? "MUST" : (c.pri === "trafienie" ? "hit" : c.pri);
  return `<span class="pri ${esc(c.pri)}">${esc(label)}</span>`;
}
function personCard(c) {
  const tel = telLink(c.tel);

function firmCard(f, open) {
  const id = fid(f);
  const isDone = !!done[id];
  const badge = f.kolejka ? `#${f.kolejka}` : f.tier;
  const ks = (f.kontakty || []).map(c => {
    const tel = telLink(c.tel);
    return `<div class="st">${priBadge(c)} ${personName(c)} · ${esc(c.rola)}
      ${tel ? " · " + tel : ""} ${c.mail ? " · " + esc(c.mail) : ""}<br>${esc(c.note)}</div>`;
  }).join("");
  const name = f.www ? `<a href="${esc(f.www)}">${esc(f.firma)}</a>` : esc(f.firma);

      <span class="tick" data-tick="${esc(id)}"></span>
      <div>
        <h3><span class="pri ${esc(f.tier)}">${esc(badge)}</span> ${name}</h3>

}

      <p><strong>30 sekund:</strong> <span class="qq">„Nie zabieram dłużej. Jedno pytanie: macie własne ekipy serwisowe, czy to idzie przez podwykonawców? … Dzięki. Wizytówka? Oddzwonimy po expo.”</span></p>

function needle(blob) { return blob.toLowerCase().includes(q.trim().toLowerCase()); }
function matchFirm(f) {
  if (!q.trim()) return true;
  const ks = (f.kontakty || []).map(c => `${c.osoba} ${c.rola} ${c.note}`).join(" ");
  return needle(`${f.firma} ${f.stoisko} ${f.kat} ${f.coRobi} ${f.teren} ${f.klienci} ${f.why} ${f.opener} ${ks}`);
}
function matchPerson(c) {
  if (!q.trim()) return true;
  return needle(`${c.osoba} ${c.firma} ${c.stoisko} ${c.rola} ${c.note} ${c.tel} ${c.mail}`);
}
function render() {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("nav").dataset.who = tab;
  $("chips").classList.add("hidden");
  $("q").classList.toggle("hidden", tab === "start");
  if (tab === "start") {
    $("hdr").textContent = "· start";
    $("main").innerHTML = info();
    return;
  }
  if (tab === "jutro") {
    $("hdr").textContent = "· po Adamie";
    const firms = DATA.jutro.filter(matchFirm);
    let html = mapsBlock(["c"], false);
    html += `<div class="st" style="margin:0 0 10px">Firmy, których Adam nie zdążył. #1 MUST — Artur Piekutowski. Świat Instalacji na końcu.</div>`;
    html += firms.map((f, i) => firmCard(f, i === 0 && !q.trim())).join("");
    if (!firms.length) html += `<div class="empty">Nic nie pasuje do wyszukiwania.</div>`;
    $("main").innerHTML = html;
    return;
  }
  if (tab === "serwis") {
    $("hdr").textContent = "· firmy + serwis";
    const firms = (DATA.serwisFirms || []).filter(matchFirm);
    let html = mapsBlock(["c"], false);
    html += `<div class="st" style="margin:0 0 10px">Nazwisko to drzwi — osoba może nie być na hali. Stoisko i tak: pytaj o serwis i ekipy. Hawle D81 → KanRo E42 → EBARA E32 → DAB D111 → Ecol F58 → ARNAP E75 → E+H F88. Bolder i Lifton — skip, Marek już był.</div>`;
    html += firms.map(f => firmCard(f, false)).join("");
    if (!firms.length) html += `<div class="empty">Nic nie pasuje do wyszukiwania.</div>`;
    $("main").innerHTML = html;
    return;
  }
  $("hdr").textContent = "· D + Heating";
  const firms = DATA.reszta.filter(matchFirm);
  const A = firms.filter(f => f.tier === "A");
  const B = firms.filter(f => f.tier === "B");

    html += `<h2>A — własne ekipy (${A.length})</h2>` + A.map(f => firmCard(f, false)).join("");
  }
  if (B.length) {
    html += `<h2>B — producent z serwisem (${B.length})</h2>` + B.map(f => firmCard(f, false)).join("");

$("q").addEventListener("input", e => { q = e.target.value; render(); });
document.querySelector(".nav").addEventListener("click", e => {

  if (!b) return;
  tab = b.dataset.tab;
  localStorage.setItem("wodkan-piotr-tab-v1", tab);
  window.scrollTo(0, 0);
  render();
});
let mapZoom = 2.2;
function applyMapZoom() {
  $("mapbox-img").style.width = (mapZoom * 100) + "%";
}
function openMap(src, title) {
  $("mapbox-img").src = src;
  $("mapbox-title").textContent = title;
  mapZoom = 2.2;
  applyMapZoom();
  $("mapbox").classList.remove("hidden");
  $("mapbox-scroller").scrollTop = 0;
  $("mapbox-scroller").scrollLeft = 0;
}
$("main").addEventListener("click", e => {
  const m = e.target.closest("[data-map]");
  if (m) {
    e.preventDefault();
    openMap(m.dataset.map, m.dataset.title);
    return;
  }
  const t = e.target.closest("[data-tick]");
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  const id = t.dataset.tick;
  if (done[id]) delete done[id]; else done[id] = true;
  saveDone();
  const card = t.closest(".firm");
  if (card) card.classList.toggle("done", !!done[id]);
});
$("mapbox-close").addEventListener("click", () => $("mapbox").classList.add("hidden"));
$("mapbox-in").addEventListener("click", () => { mapZoom = Math.min(4, mapZoom + 0.5); applyMapZoom(); });
$("mapbox-out").addEventListener("click", () => { mapZoom = Math.max(1, mapZoom - 0.5); applyMapZoom(); });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
